# Verifică stilul codului (ESLint și Prettier, conform paginii „Coding style
# frontend”) la fiecare pull request către main.
name: Stil cod

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  eslint-prettier:
    name: ESLint și Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalează dependențele
        run: npm ci
      - name: Verifică regulile (ESLint)
        run: npm run lint
      - name: Verifică formatarea (Prettier)
        run: npm run format:check
